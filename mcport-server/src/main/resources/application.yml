spring:
  application:
    name: mcport-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MCPORT_DB_HOST:localhost}:${MCPORT_DB_PORT:3307}/${MCPORT_DB_NAME:mcport_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MCPORT_DB_USERNAME:root}
    password: ${MCPORT_DB_PASSWORD}
  data:
    redis:
      host: ${MCPORT_REDIS_HOST:localhost}
      port: ${MCPORT_REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  ai:
    mcp:
      server:
        name: mcport-server
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC

server:
  port: ${MCPORT_SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: info
